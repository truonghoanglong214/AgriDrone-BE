spring:
  application:
    name: agridrone-be1
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${BE1_DB_URL:jdbc:postgresql://localhost:5433/agridrone_be1}
    username: ${BE1_DB_USERNAME:agridrone_be1}
    password: ${BE1_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      maximum-pool-size: ${BE1_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  rabbitmq:
    host: ${BE1_RABBITMQ_HOST:localhost}
    port: ${BE1_RABBITMQ_PORT:5672}
    virtual-host: ${BE1_RABBITMQ_VHOST:agridrone}
    username: ${BE1_RABBITMQ_USERNAME:agridrone}
    password: ${BE1_RABBITMQ_PASSWORD:}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${BE1_REDIS_HOST:localhost}
      port: ${BE1_REDIS_PORT:6379}
      password: ${BE1_REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
  jackson:
    time-zone: UTC

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    org.springframework.web: INFO

server:
  port: ${BE1_HTTP_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: ${BE1_OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${BE1_OPENAPI_ENABLED:true}
    persist-authorization: true
  paths-to-match: /api/**,/.well-known/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,rabbit,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

agridrone:
  runtime:
    enabled: ${BE1_RUNTIME_ENABLED:true}
  security:
    jwt:
      enabled: ${BE1_JWT_ENABLED:false}
      jwk-set-uri: ${BE1_JWT_JWK_SET_URI:}
      issuer: ${BE1_JWT_ISSUER:}
      audience: ${BE1_JWT_AUDIENCE:}
      issuer-service:
        enabled: ${BE1_JWT_ISSUER_ENABLED:false}
        issuer: ${BE1_JWT_ISSUER:}
        audience: ${BE1_JWT_AUDIENCE:}
        private-key-location: ${BE1_JWT_PRIVATE_KEY_LOCATION:}
        public-key-location: ${BE1_JWT_PUBLIC_KEY_LOCATION:}
        key-id: ${BE1_JWT_KEY_ID:}
        access-token-ttl: ${BE1_JWT_ACCESS_TOKEN_TTL:15m}
        tenant-selection-token-ttl: ${BE1_JWT_TENANT_SELECTION_TOKEN_TTL:5m}
  web:
    correlation-header: X-Correlation-ID
  messaging:
    enabled: ${BE1_MESSAGING_ENABLED:false}
    exchange: ${BE1_RABBITMQ_EXCHANGE:agridrone.events}
    retry-exchange: ${BE1_RABBITMQ_RETRY_EXCHANGE:agridrone.retry}
    dead-letter-exchange: ${BE1_RABBITMQ_DLX:agridrone.dead-letter}
    outbox:
      batch-size: ${BE1_OUTBOX_BATCH_SIZE:50}
      lease: ${BE1_OUTBOX_LEASE:30s}
      poll-delay: ${BE1_OUTBOX_POLL_DELAY:1s}
      confirm-timeout: ${BE1_OUTBOX_CONFIRM_TIMEOUT:5s}
      max-attempts: ${BE1_OUTBOX_MAX_ATTEMPTS:8}
      retry-base: ${BE1_OUTBOX_RETRY_BASE:5s}
      retry-max: ${BE1_OUTBOX_RETRY_MAX:5m}
    consumers: {}
  cache:
    enabled: ${BE1_CACHE_ENABLED:true}
    prefix: ${BE1_CACHE_PREFIX:agridrone:be1}
    version: ${BE1_CACHE_VERSION:v1}
    default-ttl: ${BE1_CACHE_DEFAULT_TTL:5m}
    timeout: ${BE1_CACHE_TIMEOUT:2s}
  identity:
    tenant-invitation:
      expiration: ${BE1_TENANT_INVITATION_EXPIRATION:72h}
    password-reset:
      reset-url: ${BE1_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
      expiration: ${BE1_PASSWORD_RESET_EXPIRATION:30m}
    system-admin-bootstrap:
      enabled: ${BE1_SYSTEM_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${BE1_SYSTEM_ADMIN_EMAIL:}
      full-name: ${BE1_SYSTEM_ADMIN_FULL_NAME:System Administrator}
  notification:
    smtp:
      enabled: ${BE1_SMTP_ENABLED:false}
      host: ${BE1_SMTP_HOST:}
      port: ${BE1_SMTP_PORT:587}
      security-mode: ${BE1_SMTP_SECURITY_MODE:STARTTLS}
      username: ${BE1_SMTP_USERNAME:}
      password: ${BE1_SMTP_PASSWORD:}
      from-address: ${BE1_SMTP_FROM_ADDRESS:}
      from-name: ${BE1_SMTP_FROM_NAME:AgriDrone}
      timeout-seconds: ${BE1_SMTP_TIMEOUT_SECONDS:30}
