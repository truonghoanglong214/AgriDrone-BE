name: AgriDrone Lightsail CD Pipeline

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag or Git SHA to deploy'
        required: false
        default: 'latest'
  push:
    branches:
      - 'main'
      - 'LongTH'
    tags:
      - 'demo-v*'

concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build Containers, Publish to GHCR & Deploy to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Release Identity & Lowercase Repo
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ] && [ "${{ github.event.inputs.release_tag }}" != "latest" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "LongTH" ]; then
            echo "RELEASE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=latest" >> $GITHUB_OUTPUT
          fi
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/src/AgriDrone.Api/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/agridrone-api:${{ steps.meta.outputs.RELEASE_TAG }}
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/agridrone-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Migrator Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/src/AgriDrone.Api/Dockerfile
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/agridrone-migrator:${{ steps.meta.outputs.RELEASE_TAG }}
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/agridrone-migrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.LIGHTSAIL_HOST != '' && secrets.LIGHTSAIL_SSH_KEY != '' }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo /opt/agridrone/scripts/deploy.sh ${{ steps.meta.outputs.RELEASE_TAG }} ${{ steps.meta.outputs.REPO_LOWER }}

  build-ai:
    name: Build & Publish AI Container to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Release Identity & Lowercase Repo
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ] && [ "${{ github.event.inputs.release_tag }}" != "latest" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "LongTH" ]; then
            echo "RELEASE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=latest" >> $GITHUB_OUTPUT
          fi
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push AI Image
        uses: docker/build-push-action@v5
        with:
          context: backend/services/metashape-service
          file: backend/services/metashape-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/agridrone-ai:${{ steps.meta.outputs.RELEASE_TAG }}
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/agridrone-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
